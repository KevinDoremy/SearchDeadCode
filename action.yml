name: 'SearchDeadCode'
author: 'Kevin Doremy'
description: 'Detect dead/unused code in Android projects (Kotlin & Java). Fast static analysis powered by tree-sitter.'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  path:
    description: 'Path to the project directory to analyze'
    required: false
    default: '.'
  version:
    description: 'Version of SearchDeadCode to use (e.g., "0.4.0" or "latest")'
    required: false
    default: 'latest'
  format:
    description: 'Output format: terminal, compact, json, sarif, html, markdown, reviewdog, csv, gitlab, checkstyle'
    required: false
    default: 'terminal'
  output:
    description: 'Output file path (for json/sarif formats)'
    required: false
    default: ''
  args:
    description: >-
      Additional arguments, whitespace-split; shell quoting is not re-parsed,
      so use the = form for flags with values (--min-confidence=low)
    required: false
    default: ''
  fail-on-findings:
    description: 'Fail the workflow if dead code is found'
    required: false
    default: 'false'
  min-confidence:
    description: 'Minimum confidence level: low, medium, high, confirmed'
    required: false
    default: 'medium'

outputs:
  findings-count:
    description: 'Number of dead code findings'
    value: ${{ steps.analyze.outputs.findings_count }}
  sarif-file:
    description: 'Path to SARIF output file (if format is sarif)'
    value: ${{ steps.analyze.outputs.sarif_file }}

runs:
  using: 'composite'
  steps:
    - name: Detect runner OS and architecture
      id: detect
      shell: bash
      run: |
        # These names must match release.yml's asset_name exactly. They used to
        # be Rust target triples (searchdeadcode-x86_64-unknown-linux-gnu),
        # which no release ever published: every download 404'd and the action
        # failed with a bare curl error. install.sh derives the same names —
        # change them in both places or in neither.
        OS="${RUNNER_OS}"
        ARCH="${RUNNER_ARCH}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64) ASSET="searchdeadcode-linux-x86_64" ;;
              ARM64) ASSET="searchdeadcode-linux-aarch64" ;;
              *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            ;;
          macOS)
            case "$ARCH" in
              X64) ASSET="searchdeadcode-macos-x86_64" ;;
              ARM64) ASSET="searchdeadcode-macos-aarch64" ;;
              *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            ;;
          Windows)
            case "$ARCH" in
              X64) ASSET="searchdeadcode-windows-x86_64.exe" ;;
              *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            ;;
          *)
            echo "::error::Unsupported OS: $OS"
            exit 1
            ;;
        esac

        echo "asset=$ASSET" >> $GITHUB_OUTPUT
        echo "os=$OS" >> $GITHUB_OUTPUT

    - name: Get latest version
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          # /releases/latest is the newest release BY DATE, and this repository
          # also tags the VS Code extension: it answers vscode-v0.1.7, which
          # publishes no binary. The list is not version-ordered either — the
          # API returns v0.4.0 ahead of v0.17.0. Keep the crate tags, take the
          # highest.
          VERSION=$(gh api repos/KevinDoremy/SearchDeadCode/releases --paginate \
            --jq '.[].tag_name | select(test("^v[0-9]"))' \
            | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          # No silent fallback to a hard-coded old version: installing a
          # three-year-old analyzer quietly is worse than a red job.
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve the latest release; pin one with the 'version' input"
            exit 1
          fi
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Cache SearchDeadCode binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.searchdeadcode/bin
        key: searchdeadcode-${{ steps.version.outputs.version }}-${{ steps.detect.outputs.asset }}

    - name: Download SearchDeadCode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        ASSET="${{ steps.detect.outputs.asset }}"
        BASE="https://github.com/KevinDoremy/SearchDeadCode/releases/download/v${VERSION}"

        mkdir -p ~/.searchdeadcode/bin
        cd ~/.searchdeadcode/bin

        echo "Downloading ${ASSET} from v${VERSION}"
        if ! curl -fsSL "${BASE}/${ASSET}" -o "$ASSET"; then
          echo "::error::${BASE}/${ASSET} could not be downloaded. Check that v${VERSION} publishes this asset."
          exit 1
        fi

        # Every release publishes a .sha256 next to each binary. Checking it is
        # what turns a wrong asset name or a truncated download into a clear
        # failure instead of a mystery further down the job — the previous
        # version of this action skipped the check and shipped a 404 for
        # several releases without anyone noticing.
        if curl -fsSL "${BASE}/${ASSET}.sha256" -o "${ASSET}.sha256"; then
          if command -v shasum > /dev/null; then
            shasum -a 256 -c "${ASSET}.sha256"
          elif command -v sha256sum > /dev/null; then
            sha256sum -c "${ASSET}.sha256"
          else
            echo "::warning::no sha256 tool on this runner, integrity not verified"
          fi
        else
          echo "::warning::no .sha256 published for ${ASSET}, integrity not verified"
        fi

        # Windows keeps the .exe: the PE loader needs the extension, and bash
        # on the runner resolves `searchdeadcode` to `searchdeadcode.exe` on
        # PATH by itself. Stripping it worked in no shell at all.
        if [ "${{ steps.detect.outputs.os }}" = "Windows" ]; then
          mv "$ASSET" searchdeadcode.exe
        else
          mv "$ASSET" searchdeadcode
          chmod +x searchdeadcode
        fi
        rm -f "${ASSET}.sha256"

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.searchdeadcode/bin" >> $GITHUB_PATH

    - name: Run SearchDeadCode analysis
      id: analyze
      shell: bash
      run: |
        # A bash ARRAY, not a concatenated string: `$CMD` unquoted went
        # through IFS splitting and glob expansion, so a path with a space
        # broke in two and an `--exclude "**/generated/**"` glob could match
        # files in the runner's cwd before the tool ever saw it.
        CMD=(searchdeadcode --min-confidence "${{ inputs.min-confidence }}")

        FORMAT="${{ inputs.format }}"
        CMD+=(--format "$FORMAT")

        OUTPUT="${{ inputs.output }}"
        if [ -n "$OUTPUT" ]; then
          CMD+=(--output "$OUTPUT")
          if [ "$FORMAT" = "sarif" ]; then
            echo "sarif_file=$OUTPUT" >> $GITHUB_OUTPUT
          fi
        elif [ "$FORMAT" = "sarif" ]; then
          OUTPUT="searchdeadcode-results.sarif"
          CMD+=(--output "$OUTPUT")
          echo "sarif_file=$OUTPUT" >> $GITHUB_OUTPUT
        fi

        # Whitespace-split on purpose; shell quoting inside `args` is NOT
        # re-parsed. Flags with values use the `=` form: --min-confidence=low.
        ARGS="${{ inputs.args }}"
        if [ -n "$ARGS" ]; then
          read -ra EXTRA <<< "$ARGS"
          CMD+=("${EXTRA[@]}")
        fi

        # The gate is the tool's own exit code, not a grep of its prose:
        # 0 = clean, 1 = findings remain, 2 = the tool could not work,
        # 3 = the ratchet refused an increase. Reading stdout instead made a
        # crashed binary look like a clean project.
        if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          CMD+=(--fail-on-findings)
        fi

        CMD+=("${{ inputs.path }}")

        echo "Running: ${CMD[*]}"
        echo "---"

        # stdout and stderr stay separate: machine formats (json, checkstyle,
        # reviewdog) own stdout, and mixing the two made piped output
        # unparsable whenever the tool printed a status line.
        set +e
        STDOUT_TEXT=$("${CMD[@]}" 2> stderr.log)
        EXIT_CODE=$?
        set -e

        [ -s stderr.log ] && cat stderr.log >&2
        rm -f stderr.log
        echo "$STDOUT_TEXT"

        # findings_count, from the most reliable source each format offers.
        # The JSON report's array key is `issues` — `.findings` does not
        # exist, and `null | length` is 0 in jq, so the old expression
        # reported zero findings on every JSON run without ever erroring.
        FINDINGS=""
        case "$FORMAT" in
          json)
            if [ -n "$OUTPUT" ]; then
              FINDINGS=$(jq '.issues | length' "$OUTPUT" 2>/dev/null || echo "")
            else
              FINDINGS=$(echo "$STDOUT_TEXT" | jq '.issues | length' 2>/dev/null || echo "")
            fi
            ;;
          checkstyle)
            if [ -n "$OUTPUT" ]; then
              FINDINGS=$(grep -c '<error ' "$OUTPUT" 2>/dev/null || true)
            else
              FINDINGS=$(echo "$STDOUT_TEXT" | grep -c '<error ' || true)
            fi
            ;;
          terminal|compact)
            FINDINGS=$(echo "$STDOUT_TEXT" | grep -oE 'Found [0-9]+ dead code' | grep -oE '[0-9]+' || echo "")
            [ -z "$FINDINGS" ] && [ "$EXIT_CODE" = "0" ] && FINDINGS=0
            ;;
        esac

        echo "findings_count=$FINDINGS" >> $GITHUB_OUTPUT

        if [ "$EXIT_CODE" = "2" ]; then
          echo "::error::searchdeadcode could not complete the analysis (exit 2)"
          exit 2
        fi

        if [ "$EXIT_CODE" = "3" ]; then
          echo "::error::the ratchet refused an increase against the baseline (exit 3)"
          exit 3
        fi

        if [ "$EXIT_CODE" != "0" ]; then
          if [ -n "$FINDINGS" ]; then
            echo "::error::Found $FINDINGS dead code issue(s)"
          else
            echo "::error::dead code findings remain (see the report above)"
          fi
          exit 1
        fi

        exit 0

    - name: Upload SARIF to GitHub Security
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif_file }}
