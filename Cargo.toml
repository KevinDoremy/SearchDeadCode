[package]
name = "searchdeadcode"
version = "0.16.1"
edition = "2021"
default-run = "searchdeadcode"
rust-version = "1.80"  # MSRV - Minimum Supported Rust Version (LazyLock)
authors = ["Kevin"]
description = "A fast CLI tool to detect and remove dead/unused code in Android projects (Kotlin & Java)"
license = "MIT"
repository = "https://github.com/KevinDoremy/SearchDeadCode"
homepage = "https://github.com/KevinDoremy/SearchDeadCode"
documentation = "https://github.com/KevinDoremy/SearchDeadCode#readme"
readme = "README.md"
keywords = ["dead-code", "kotlin", "java", "android", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Parsing
# tree-sitter is pinned below 0.23 by tree-sitter-kotlin (0.3.8 requires
# >=0.21,<0.23). tree-sitter-java 0.23+ wants ^0.24, and tree-sitter sets
# links = "tree-sitter" so only one copy can exist — the two grammars are
# mutually exclusive past 0.22. Nothing to bump here until upstream Kotlin moves.
tree-sitter = "0.22"
tree-sitter-kotlin = "0.3.8"
tree-sitter-java = "0.21"

# Graph
petgraph = "0.8"

# File discovery
ignore = "0.4"
globset = "0.4"
walkdir = "2.5"

# Parallelism
rayon = "1.12"

# CLI
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml ships as 0.9.34+deprecated and its repo is archived. Of the forks,
# only this one is still published (May 2026) — serde_norway stopped at Dec
# 2024, serde_yaml_ng at May 2024.
#
# 2.5.4 fixed a Miri-detected memory leak on crafted YAML plus over-reads on
# malformed streams. That is why regex sits at 1.12 below: 2.5.3 onward caps it
# at <1.13, and the security fixes are worth more than a regex minor we don't
# use anything from.
serde_yaml_bw = "2.5.6"
toml = "1.1"

# XML parsing
quick-xml = "0.41"

# Regex for resource detection
regex = "1.12"

# Terminal UI
colored = "3.1"
indicatif = "0.18"
console = "0.16"

# Error handling
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
anyhow = "1.0"

# Interactive prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }

# File watching
notify = "8.2"
notify-debouncer-mini = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
criterion = "0.8"

[features]
# Le bench n'est plus construit par `cargo test` : criterion et les 26 crates
# qu'il tire (plotters, deux proc-macros) sortent du chemin de validation.
bench = []

[[bench]]
name = "parsing_bench"
harness = false
required-features = ["bench"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Tester en release (lto fat + codegen-units 1) coutait 2 min 49 par
# iteration. Le debuginfo complet, lui, remplissait 57 Go dans target/debug.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits = "dev"
