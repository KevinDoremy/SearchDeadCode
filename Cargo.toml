[package]
name = "searchdeadcode"
version = "0.10.2"
edition = "2021"
default-run = "searchdeadcode"
rust-version = "1.80"  # MSRV - Minimum Supported Rust Version (LazyLock)
authors = ["Kevin"]
description = "A fast CLI tool to detect and remove dead/unused code in Android projects (Kotlin & Java)"
license = "MIT"
repository = "https://github.com/KevinDoremy/SearchDeadCode"
homepage = "https://github.com/KevinDoremy/SearchDeadCode"
documentation = "https://github.com/KevinDoremy/SearchDeadCode#readme"
readme = "README.md"
keywords = ["dead-code", "kotlin", "java", "android", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Parsing
tree-sitter = "0.22"
tree-sitter-kotlin = "0.3.6"
tree-sitter-java = "0.21"

# Graph
petgraph = "0.8"

# File discovery
ignore = "0.4"
walkdir = "2.4"

# Parallelism
rayon = "1.8"

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"

# XML parsing
quick-xml = "0.38"

# Regex for resource detection
regex = "1.10"

# Terminal UI
colored = "3.0"
indicatif = "0.18"
console = "0.16"

# Error handling
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
anyhow = "1.0"

# Interactive prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }

# File watching
notify = "8.0"
notify-debouncer-mini = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"
criterion = "0.8"

[[bench]]
name = "parsing_bench"
harness = false

