# The release pipeline overrides pluginVersion with the crate version
# (-PpluginVersion=X.Y.Z) — one number on every platform. The dev default is
# deliberately not a valid release so the binary downloader refuses it.
pluginVersion=0.0.0-dev

# Floor: Android Studio Ladybug (2024.2) and its IntelliJ 242 branch.
pluginSinceBuild=242

# Built against IntelliJ Community: the plugin uses no Android API, so an
# IC-only API surface is exactly what guarantees it runs inside Android Studio.
platformVersion=2024.2.6

# The IDE bundles the Kotlin stdlib; shipping our own copy is rejected by the
# Marketplace verifier.
kotlin.stdlib.default.dependency=false

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g
