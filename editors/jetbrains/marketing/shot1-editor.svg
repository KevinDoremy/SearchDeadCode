<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121f"/><stop offset="1" stop-color="#221f36"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="popshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="86" cy="84" r="34" fill="#1a1a2e" stroke="#ff6b35" stroke-width="3"/>
  <line x1="97" y1="95" x2="112" y2="110" stroke="#ff6b35" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="78" r="19" fill="none" stroke="#ff6b35" stroke-width="4"/>
  <text x="140" y="76" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Dead code greys out where you write it</text>
  <text x="140" y="108" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a9ab0">Warning severity at most, the detector id on every finding, Alt+Enter to act</text>

  <!-- editor panel -->
  <rect x="60" y="150" width="1160" height="590" rx="12" fill="#1e1f22" stroke="#3c3d40" stroke-width="1" filter="url(#shadow)"/>
  <path d="M60 162 a12 12 0 0 1 12 -12 h1136 a12 12 0 0 1 12 12 v28 h-1160 z" fill="#2b2d30"/>
  <circle cx="86" cy="170" r="6" fill="#ff5f57"/><circle cx="108" cy="170" r="6" fill="#febc2e"/><circle cx="130" cy="170" r="6" fill="#28c840"/>
  <text x="640" y="176" font-family="Menlo, monospace" font-size="14" fill="#9a9ab0" text-anchor="middle">PaymentFlow.kt</text>

  <g font-family="Menlo, monospace" font-size="17" fill="#5a5b5e" text-anchor="end">
    <text x="112" y="240">12</text><text x="112" y="274">13</text><text x="112" y="308">14</text>
    <text x="112" y="342">15</text><text x="112" y="376">16</text><text x="112" y="410">17</text>
    <text x="112" y="444">18</text><text x="112" y="478">19</text><text x="112" y="512">20</text>
  </g>
  <g font-family="Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="136" y="240"><tspan fill="#cf8e6d">class </tspan><tspan fill="#bcbec4">PaymentFlow(</tspan><tspan fill="#cf8e6d">private val </tspan><tspan fill="#bcbec4">gateway: Gateway) {</tspan></text>
    <text x="136" y="274"><tspan fill="#bcbec4">    </tspan><tspan fill="#cf8e6d">fun </tspan><tspan fill="#56a8f5">charge</tspan><tspan fill="#bcbec4">(amount: Cents): Receipt = gateway.submit(amount)</tspan></text>
    <text x="136" y="308" fill="#bcbec4">}</text>
  </g>
  <!-- dead block, greyed -->
  <rect x="122" y="320" width="620" height="132" rx="6" fill="#26262e"/>
  <g font-family="Menlo, monospace" font-size="17" fill="#6f7178" xml:space="preserve">
    <text x="136" y="342">class LegacyEncoder {</text>
    <text x="136" y="376">    fun encode(payload: String): ByteArray =</text>
    <text x="136" y="410">        payload.toByteArray(Charsets.ISO_8859_1)</text>
    <text x="136" y="444">}</text>
  </g>
  <text x="1096" y="343" font-family="Menlo, monospace" font-size="15" fill="#8b8d92" text-anchor="end">class 'LegacyEncoder' is never used</text>
  <rect x="1110" y="326" width="66" height="24" rx="4" fill="#ff6b35" opacity="0.18"/>
  <text x="1143" y="343" font-family="Menlo, monospace" font-size="14" fill="#ff6b35" text-anchor="middle">DC001</text>
  <g font-family="Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="136" y="512"><tspan fill="#cf8e6d">fun </tspan><tspan fill="#56a8f5">main</tspan><tspan fill="#bcbec4">() = PaymentFlow(HttpGateway()).charge(</tspan><tspan fill="#2aacb8">4200</tspan><tspan fill="#bcbec4">)</tspan></text>
  </g>

  <!-- quick fix popup -->
  <rect x="240" y="470" width="470" height="196" rx="10" fill="#2b2d30" stroke="#4a4c50" stroke-width="1.5" filter="url(#popshadow)"/>
  <rect x="248" y="482" width="454" height="40" rx="6" fill="#3574f0"/>
  <text x="268" y="508" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">Delete unused class 'LegacyEncoder'</text>
  <text x="268" y="552" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#bcbec4">Ignore here with a reason</text>
  <text x="268" y="592" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#bcbec4">Add to searchdeadcode baseline (DC001)</text>
  <text x="268" y="632" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#bcbec4">Open searchdeadcode rule documentation</text>

  <text x="640" y="775" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6f7188" text-anchor="middle">Findings describe the disk: documents are saved before the scan, and an edited file drops its findings instantly</text>
</svg>
