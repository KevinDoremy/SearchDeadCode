ext x="112" y="478">19</text><text x="112" y="512">20</text></g><g font-family="Menlo, monospace" font-size="17" xml:space="preserve"><text x="136" y="240"><tspan fill="#cf8e6d">class </tspan><tspan fill="#bcbec4">PaymentFlow(</tspan><tspan fill="#cf8e6d">private val </tspan><tspan fill="#bcbec4">gateway: Gateway) {</tspan></text><text x="136" y="274"><tspan fill="#cf8e6d">fun </tspan><tspan fill="#56a8f5">charge</tspan><tspan fill="#bcbec4">(amount: Cents): Receipt = gateway.submit(amount)</tspan></text><text x="136" y="308" fill="#bcbec4">}</text></g><rect width="620" height="132" x="122" y="320" fill="#26262e" rx="6"/><g fill="#6f7178" font-family="Menlo, monospace" font-size="17" xml:space="preserve"><text x="136" y="342">class LegacyEncoder {</text><text x="136" y="376">fun encode(payload: String): ByteArray =</text><text x="136" y="410">payload.toByteArray(Charsets.ISO_8859_1)</text><text x="136" y="444">}</text></g><text x="1096" y="343" fill="#8b8d92" font-family="Menlo, monospace" font-size="15" text-anchor="end">class &apos;LegacyEncoder&apos; is never used</text><rect width="66" height="24" x="1110" y="326" fill="#ff6b35" opacity=".18" rx="4"/><text x="1143" y="343" fill="#ff6b35" font-family="Menlo, monospace" font-size="14" text-anchor="middle">DC001</text><g font-family="Menlo, monospace" font-size="17" xml:space="preserve"><text x="136" y="512"><tspan fill="#cf8e6d">fun </tspan><tspan fill="#56a8f5">main</tspan><tspan fill="#bcbec4">() = PaymentFlow(HttpGateway()).charge(</tspan><tspan fill="#2aacb8">4200</tspan><tspan fill="#bcbec4">)</tspan></text></g><rect width="470" height="196" x="240" y="470" fill="#2b2d30" stroke="#4a4c50" stroke-width="1.5" filter="url(#popshadow)" rx="10"/><rect width="454" height="40" x="248" y="482" fill="#3574f0" rx="6"/><text x="268" y="508" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="17">Delete unused class &apos;LegacyEncoder&apos;</text><text x="268" y="552" fill="#bcbec4" font-family="Helvetica, Arial, sans-serif" font-size="17">Ignore here with a reason</text><text x="268" y="592" fill="#bcbec4" font-family="Helvetica, Arial, sans-serif" font-size="17">Add to searchdeadcode baseline (DC001)</text><text x="268" y="632" fill="#bcbec4" font-family="Helvetica, Arial, sans-serif" font-size="17">Open searchdeadcode rule documentation</text><text x="640" y="775" fill="#6f7188" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">Findings describe the disk: documents are saved before the scan, and an edited file drops its findings instantly</text></svg>