<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121f"/><stop offset="1" stop-color="#221f36"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="86" cy="84" r="34" fill="#1a1a2e" stroke="#ff6b35" stroke-width="3"/>
  <line x1="97" y1="95" x2="112" y2="110" stroke="#ff6b35" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="78" r="19" fill="none" stroke="#ff6b35" stroke-width="4"/>
  <text x="140" y="76" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">The editor and the pipeline agree</text>
  <text x="140" y="108" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9a9ab0">One analyzer, one version number, one baseline file</text>

  <!-- card 1: IDE -->
  <rect x="60" y="170" width="360" height="380" rx="14" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)"/>
  <text x="240" y="216" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">In the IDE</text>
  <rect x="88" y="240" width="304" height="170" rx="8" fill="#26262e"/>
  <g font-family="Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="104" y="270" fill="#bcbec4">class PaymentFlow { ... }</text>
    <text x="104" y="300" fill="#6f7178">class LegacyEncoder {</text>
    <text x="104" y="326" fill="#6f7178">    fun encode(...) = ...</text>
    <text x="104" y="352" fill="#6f7178">}</text>
    <text x="104" y="390" fill="#ff8f66">DC001  Alt+Enter to delete</text>
  </g>
  <text x="240" y="446" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">Greyed findings, quick fixes,</text>
  <text x="240" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">tool window</text>
  <rect x="160" y="494" width="160" height="30" rx="15" fill="#ff6b35" opacity="0.16"/>
  <text x="240" y="514" font-family="Menlo, monospace" font-size="14" fill="#ff6b35" text-anchor="middle">plugin 0.19.1</text>

  <!-- arrow -->
  <text x="447" y="370" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7d8590">&#8596;</text>

  <!-- card 2: baseline -->
  <rect x="490" y="170" width="300" height="380" rx="14" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)"/>
  <text x="640" y="216" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">One baseline</text>
  <rect x="514" y="240" width="252" height="170" rx="8" fill="#26262e"/>
  <g font-family="Menlo, monospace" font-size="13" xml:space="preserve">
    <text x="530" y="270" fill="#bcbec4">.deadcode-baseline.json</text>
    <text x="530" y="300" fill="#7d8590">{</text>
    <text x="530" y="324" fill="#7d8590">  "file": "src/Legacy.kt",</text>
    <text x="530" y="348" fill="#7d8590">  "name": "OldHelper",</text>
    <text x="530" y="372" fill="#7d8590">  "rule": "DC001"</text>
    <text x="530" y="396" fill="#7d8590">}</text>
  </g>
  <text x="640" y="446" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">The IDE quick fix writes it,</text>
  <text x="640" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">the CI profile reads it</text>
  <rect x="560" y="494" width="160" height="30" rx="15" fill="#ffd166" opacity="0.16"/>
  <text x="640" y="514" font-family="Menlo, monospace" font-size="14" fill="#ffd166" text-anchor="middle">committed</text>

  <!-- arrow -->
  <text x="817" y="370" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7d8590">&#8596;</text>

  <!-- card 3: CI -->
  <rect x="860" y="170" width="360" height="380" rx="14" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)"/>
  <text x="1040" y="216" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">In the pipeline</text>
  <rect x="888" y="240" width="304" height="170" rx="8" fill="#101014"/>
  <g font-family="Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="904" y="272" fill="#28c840">$ </text><text x="924" y="272" fill="#dfe1e5">searchdeadcode . --profile ci</text>
    <text x="904" y="306" fill="#9a9ab0">Analyzed 4,812 files in 3.1s</text>
    <text x="904" y="334" fill="#9a9ab0">Baseline: 41 known, skipped</text>
    <text x="904" y="368" fill="#ff8f66">1 new finding &#8594; exit 1</text>
  </g>
  <text x="1040" y="446" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">Fails only on what a branch adds.</text>
  <text x="1040" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a9ab0" text-anchor="middle">GitHub Action, orb, GitLab, Jenkins</text>
  <rect x="960" y="494" width="160" height="30" rx="15" fill="#ff6b35" opacity="0.16"/>
  <text x="1040" y="514" font-family="Menlo, monospace" font-size="14" fill="#ff6b35" text-anchor="middle">cli 0.19.1</text>

  <!-- bottom strip -->
  <rect x="60" y="600" width="1160" height="120" rx="14" fill="#1a1a2e" stroke="#3c3d40" filter="url(#shadow)"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#bcbec4">
    <text x="120" y="652" font-weight="bold" fill="#ffffff">No JVM, no Gradle task</text>
    <text x="120" y="682">A native binary: 4,812 files in 3.1 s</text>
    <text x="640" y="652" font-weight="bold" fill="#ffffff" text-anchor="middle">Nothing bundled</text>
    <text x="640" y="682" text-anchor="middle">Version-pinned download, SHA-256 checked</text>
    <text x="1160" y="652" font-weight="bold" fill="#ffffff" text-anchor="end">MIT, open source</text>
    <text x="1160" y="682" text-anchor="end">github.com/KevinDoremy/SearchDeadCode</text>
  </g>
</svg>
