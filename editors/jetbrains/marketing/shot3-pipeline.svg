<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#12121f"/><stop offset="1" stop-color="#221f36"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".45" stdDeviation="18"/></filter></defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="86" cy="84" r="34" fill="#1a1a2e" stroke="#ff6b35" stroke-width="3"/><line x1="97" x2="112" y1="95" y2="110" stroke="#ff6b35" stroke-linecap="round" stroke-width="6"/><circle cx="80" cy="78" r="19" fill="none" stroke="#ff6b35" stroke-width="4"/><text x="140" y="76" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold">The editor and the pipeline agree</text><text x="140" y="108" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="19">One analyzer, one version number, one baseline file</text><rect width="360" height="380" x="60" y="170" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)" rx="14"/><text x="240" y="216" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">In the IDE</text><rect width="304" height="170" x="88" y="240" fill="#26262e" rx="8"/><g font-family="Menlo, monospace" font-size="14" xml:space="preserve"><text x="104" y="270" fill="#bcbec4">class PaymentFlow { ... }</text><text x="104" y="300" fill="#6f7178">class LegacyEncoder {</text><text x="104" y="326" fill="#6f7178">fun encode(...) = ...</text><text x="104" y="352" fill="#6f7178">}</text><text x="104" y="390" fill="#ff8f66">DC001 Alt+Enter to delete</text></g><text x="240" y="446" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">Greyed findings, quick fixes,</text><text x="240" y="470" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">tool window</text><rect width="160" height="30" x="160" y="494" fill="#ff6b35" opacity=".16" rx="15"/><text x="240" y="514" fill="#ff6b35" font-family="Menlo, monospace" font-size="14" text-anchor="middle">plugin 0.19.1</text><text x="447" y="370" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="30">↔</text><rect width="300" height="380" x="490" y="170" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)" rx="14"/><text x="640" y="216" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">One baseline</text><rect width="252" height="170" x="514" y="240" fill="#26262e" rx="8"/><g font-family="Menlo, monospace" font-size="13" xml:space="preserve"><text x="530" y="270" fill="#bcbec4">.deadcode-baseline.json</text><text x="530" y="300" fill="#7d8590">{</text><text x="530" y="324" fill="#7d8590">&quot;file&quot;: &quot;src/Legacy.kt&quot;,</text><text x="530" y="348" fill="#7d8590">&quot;name&quot;: &quot;OldHelper&quot;,</text><text x="530" y="372" fill="#7d8590">&quot;rule&quot;: &quot;DC001&quot;</text><text x="530" y="396" fill="#7d8590">}</text></g><text x="640" y="446" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">The IDE quick fix writes it,</text><text x="640" y="470" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">the CI profile reads it</text><rect width="160" height="30" x="560" y="494" fill="#ffd166" opacity=".16" rx="15"/><text x="640" y="514" fill="#ffd166" font-family="Menlo, monospace" font-size="14" text-anchor="middle">committed</text><text x="817" y="370" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="30">↔</text><rect width="360" height="380" x="860" y="170" fill="#1e1f22" stroke="#3c3d40" filter="url(#shadow)" rx="14"/><text x="1040" y="216" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">In the pipeline</text><rect width="304" height="170" x="888" y="240" fill="#101014" rx="8"/><g font-family="Menlo, monospace" font-size="14" xml:space="preserve"><text x="904" y="272" fill="#28c840">$</text><text x="924" y="272" fill="#dfe1e5">searchdeadcode . --profile ci</text><text x="904" y="306" fill="#9a9ab0">Analyzed 4,812 files in 3.1s</text><text x="904" y="334" fill="#9a9ab0">Baseline: 41 known, skipped</text><text x="904" y="368" fill="#ff8f66">1 new finding → exit 1</text></g><text x="1040" y="446" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">Fails only on what a branch adds.</text><text x="1040" y="470" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">GitHub Action, orb, GitLab, Jenkins</text><rect width="160" height="30" x="960" y="494" fill="#ff6b35" opacity=".16" rx="15"/><text x="1040" y="514" fill="#ff6b35" font-family="Menlo, monospace" font-size="14" text-anchor="middle">cli 0.19.1</text><rect width="1160" height="120" x="60" y="600" fill="#1a1a2e" stroke="#3c3d40" filter="url(#shadow)" rx="14"/><g fill="#bcbec4" font-family="Helvetica, Arial, sans-serif" font-size="17"><text x="120" y="652" fill="#fff" font-weight="bold">No JVM, no Gradle task</text><text x="120" y="682">A native binary: 4,812 files in 3.1 s</text><text x="640" y="652" fill="#fff" font-weight="bold" text-anchor="middle">Nothing bundled</text><text x="640" y="682" text-anchor="middle">Version-pinned download, SHA-256 checked</text><text x="1160" y="652" fill="#fff" font-weight="bold" text-anchor="end">MIT, open source</text><text x="1160" y="682" text-anchor="end">github.com/KevinDoremy/SearchDeadCode</text></g></svg>