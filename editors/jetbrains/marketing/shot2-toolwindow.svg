<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#12121f"/><stop offset="1" stop-color="#221f36"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".45" stdDeviation="18"/></filter></defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="86" cy="84" r="34" fill="#1a1a2e" stroke="#ff6b35" stroke-width="3"/><line x1="97" x2="112" y1="95" y2="110" stroke="#ff6b35" stroke-linecap="round" stroke-width="6"/><circle cx="80" cy="78" r="19" fill="none" stroke="#ff6b35" stroke-width="4"/><text x="140" y="76" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold">Every finding, one tool window</text><text x="140" y="108" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="19">Grouped by file, double-click navigates, counters that stay honest when you edit</text><rect width="1160" height="590" x="60" y="150" fill="#1e1f22" stroke="#3c3d40" stroke-width="1" filter="url(#shadow)" rx="12"/><path fill="#2b2d30" d="M60 162 a12 12 0 0 1 12 -12 h1136 a12 12 0 0 1 12 12 v28 h-1160 z"/><text x="84" y="177" fill="#dfe1e5" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">SearchDeadCode</text><g fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="14"><rect width="72" height="26" x="228" y="157" fill="#3c3d40" rx="5"/><text x="264" y="175" fill="#dfe1e5" text-anchor="middle">Scan</text><rect width="72" height="26" x="308" y="157" fill="#33343a" rx="5"/><text x="344" y="175" text-anchor="middle">Clear</text></g><rect width="1160" height="40" x="60" y="190" fill="#26262e"/><text x="84" y="216" fill="#bcbec4" font-family="Helvetica, Arial, sans-serif" font-size="16">20 findings in 5 files • scanned at 14:32 • 1 file edited since, its findings dropped</text><g font-family="Menlo, monospace" font-size="16" xml:space="preserve"><text x="92" y="268" fill="#7d8590">▾</text><text x="116" y="268" fill="#dfe1e5">app/src/main/kotlin/payments/LegacyEncoder.kt</text><text x="600" y="268" fill="#7d8590">(3)</text><rect width="1128" height="34" x="76" y="284" fill="#2d436b" rx="5"/><text x="140" y="307" fill="#dfe1e5">15: class &apos;LegacyEncoder&apos; is never used</text><text x="620" y="307" fill="#ff8f66">[DC001]</text><text x="140" y="345" fill="#bcbec4">42: function &apos;encodeV2&apos; is never used</text><text x="620" y="345" fill="#ff8f66">[DC013]</text><text x="140" y="383" fill="#bcbec4">58: import &apos;java.util.Base64&apos; is never used</text><text x="620" y="383" fill="#ff8f66">[DC004]</text><text x="92" y="428" fill="#7d8590">▸</text><text x="116" y="428" fill="#dfe1e5">app/src/main/kotlin/ui/ThemeCompat.kt</text><text x="600" y="428" fill="#7d8590">(6)</text><text x="92" y="472" fill="#7d8590">▸</text><text x="116" y="472" fill="#dfe1e5">core/src/main/kotlin/net/RetryPolicy.kt</text><text x="600" y="472" fill="#7d8590">(2)</text><text x="92" y="516" fill="#7d8590">▸</text><text x="116" y="516" fill="#dfe1e5">features/profile/src/main/kotlin/AvatarCache.kt</text><text x="600" y="516" fill="#7d8590">(4)</text><text x="92" y="560" fill="#7d8590">▸</text><text x="116" y="560" fill="#dfe1e5">app/src/main/java/analytics/LegacyTracker.java</text><text x="600" y="560" fill="#7d8590">(5)</text></g><rect width="400" height="160" x="780" y="420" fill="#26262e" stroke="#3c3d40" rx="10"/><text x="804" y="454" fill="#dfe1e5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Kotlin and Java, Android-aware</text><text x="804" y="486" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15">Activities, Compose, DI annotations and</text><text x="804" y="510" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15">manifest entries count as roots, so what</text><text x="804" y="534" fill="#9a9ab0" font-family="Helvetica, Arial, sans-serif" font-size="15">the framework calls is never &quot;dead&quot;.</text><text x="804" y="562" fill="#7d8590" font-family="Helvetica, Arial, sans-serif" font-size="15">22 detectors, each with a documented id.</text><text x="640" y="775" fill="#6f7188" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">Scan on demand from the Tools menu, like a linter: no indexing, no background churn</text></svg>