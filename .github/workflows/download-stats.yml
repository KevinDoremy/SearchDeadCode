name: Download stats

on:
  schedule:
    # Daily, off the :00 mark. GitHub's traffic API only keeps 14 days of
    # clone/view history: this snapshot is what makes it permanent.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stats

      - name: Collect and append snapshot
        env:
          # The default token cannot read traffic data. Add a classic PAT
          # with repo scope as TRAFFIC_TOKEN to capture clones/views; the
          # other counters work without it.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          date_utc=$(date -u +%Y-%m-%d)
          crates=$(curl -s -A "searchdeadcode-stats" \
            https://crates.io/api/v1/crates/searchdeadcode | jq '.crate.downloads // 0' 2>/dev/null)
          assets=$(gh api "repos/${{ github.repository }}/releases" 2>/dev/null \
            | jq '[.[].assets[].download_count] | add // 0' 2>/dev/null)
          stars=$(gh api "repos/${{ github.repository }}" 2>/dev/null \
            | jq '.stargazers_count' 2>/dev/null)
          # gh api emits the error body on stdout on HTTP failures: pipe
          # through jq so garbage collapses to empty, then fall back
          clones=$(gh api "repos/${{ github.repository }}/traffic/clones" 2>/dev/null \
            | jq -c 'select(.count != null) | {count, uniques}' 2>/dev/null)
          views=$(gh api "repos/${{ github.repository }}/traffic/views" 2>/dev/null \
            | jq -c 'select(.count != null) | {count, uniques}' 2>/dev/null)

          # Validate every piece; anything invalid is reported and replaced
          for name in crates assets stars; do
            if ! printf '%s' "${!name}" | jq -e . >/dev/null 2>&1; then
              echo "invalid $name: <${!name}>, using 0"
              printf -v "$name" '0'
            fi
          done
          for name in clones views; do
            if ! printf '%s' "${!name}" | jq -e . >/dev/null 2>&1; then
              echo "invalid $name: <${!name}>, using {}"
              printf -v "$name" '{}'
            fi
          done

          jq -c -n \
            --arg date "$date_utc" \
            --argjson crates "$crates" \
            --argjson assets "$assets" \
            --argjson stars "$stars" \
            --argjson clones "$clones" \
            --argjson views "$views" \
            '{date: $date, crates_io: $crates, github_assets: $assets,
              stars: $stars, clones_14d: $clones, views_14d: $views}' \
            >> stats/downloads.jsonl

          tail -1 stats/downloads.jsonl

          # Refresh the README clones badge (shields.io endpoint schema).
          # Without traffic access, keep the last known badge instead of n/a.
          clone_count=$(echo "$clones" | jq -r '.count // empty')
          if [ -n "$clone_count" ]; then
            jq -c -n --arg msg "$clone_count" \
              '{schemaVersion: 1, label: "clones (14d)", message: $msg,
                color: "informational"}' > stats/clones-badge.json
          fi

          # All-time cumulative counter: seeded with an estimate, then grown
          # with exact daily deltas. counted_through prevents double counting
          # across the API's overlapping 14-day windows; today is excluded
          # because its count is still partial.
          if [ -n "$clone_count" ] && [ -f stats/cumulative.json ]; then
            daily=$(gh api "repos/${{ github.repository }}/traffic/clones" 2>/dev/null \
              | jq -c '.clones // []' 2>/dev/null)
            [ -n "$daily" ] || daily='[]'
            cum=$(cat stats/cumulative.json)
            jq -c -n --argjson cum "$cum" --argjson daily "$daily" --arg today "$date_utc" '
              ($cum.counted_through) as $ct
              | ([ $daily[]
                  | select(((.timestamp | split("T")[0]) > $ct)
                            and ((.timestamp | split("T")[0]) < $today))
                  | .count ] | add // 0) as $delta
              | ([ $daily[] | (.timestamp | split("T")[0]) | select(. < $today) ]
                  | max // $ct) as $seen
              | $cum
              | .total += $delta
              | .counted_through = (if $seen > $ct then $seen else $ct end)
            ' > stats/cumulative.json
            jq -c -n --arg msg "$(jq -r '.total' stats/cumulative.json)" \
              '{schemaVersion: 1, label: "total clones (est.)", message: $msg,
                color: "informational"}' > stats/cumulative-badge.json
          fi

      - name: Push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/downloads.jsonl stats/clones-badge.json \
            stats/cumulative.json stats/cumulative-badge.json
          git commit -m "stats: snapshot $(date -u +%Y-%m-%d)" || exit 0
          git push origin stats
