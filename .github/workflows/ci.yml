name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Trois commits pousses d'affilee lançaient trois CI completes, dont deux
# obsoletes avant leur premiere minute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Une PR se valide sur ubuntu. macOS coute 10x, Windows 2x : ils
        # gardent le portage honnete sur main et sur les tags, pas a chaque
        # iteration.
        os: ${{ github.event_name == 'pull_request'
                && fromJSON('["ubuntu-latest"]')
                || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Remplace actions/cache sur target/ : rust-cache elague les artefacts
    # avant de sauvegarder et invalide par crate, la ou l'archive complete
    # coutait plus cher a transferer que la compilation qu'elle evitait.
    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    # Plus de `cargo build --release` ici : la compilation des tests couvre
    # deja tout le code, et le binaire distribue se construit sur tag.
    - name: Run tests
      run: cargo nextest run --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    # Sans --all-features : la feature `bench` ne sert qu'a construire le
    # bench criterion, qui n'a rien a verifier ici.
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  # The branch protection on main requires a check named "CI". The matrix job
  # names carry their OS, so none of them can carry that name — this one does,
  # and it survives adding an OS or renaming a job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, lint]
    # Without always(), a failed dependency skips this job, and a skipped check
    # reads as neutral to the protection rule — a red build would merge.
    if: always()
    steps:
    - name: Verdict
      run: |
        [ "${{ needs.build.result }}" = success ] \
          && [ "${{ needs.lint.result }}" = success ]
