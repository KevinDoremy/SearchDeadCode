name: Release

on:
  push:
    tags:
      # Digit-anchored so this never fires on the extension's vscode-v* tags.
      # A bare 'v*' matches those too, and tagging the extension would cut a
      # full crate release.
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: searchdeadcode
            asset_name: searchdeadcode-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: searchdeadcode
            asset_name: searchdeadcode-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: searchdeadcode
            asset_name: searchdeadcode-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: searchdeadcode
            asset_name: searchdeadcode-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: searchdeadcode.exe
            asset_name: searchdeadcode-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@v4
        with:
          # Let the action compute the sha256 itself: github.sha is a git
          # SHA-1 and attest-sbom v4 rejects it as a subject digest
          subject-path: sbom.cdx.json
          sbom-path: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  release:
    name: Create Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For cosign keyless signing

    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          for f in searchdeadcode-*; do
            if [[ "$f" != *.exe ]]; then
              chmod +x "$f"
            fi
            sha256sum "$f" > "$f.sha256"
          done

          # Channel counters. GitHub keeps a download_count per asset and
          # nothing else — no user-agent, no channel. These four tiny files
          # give each install path its own counter: install.sh, action.yml
          # and agent sessions GET the matching one, fire-and-forget, and the
          # daily stats snapshot reads the counts back. An event count only:
          # no identity travels beyond the HTTP request GitHub already sees.
          # The `channel-` prefix keeps them out of the searchdeadcode-*
          # loops above and below (no sha256, no cosign).
          for c in install-sh install-ci install-agent install-action; do
            echo "download counter for the '$c' channel — see download-stats.yml" > "channel-$c"
          done
          ls -la

      - name: Sign release artifacts with cosign
        run: |
          cd release
          for f in searchdeadcode-*; do
            if [[ "$f" != *.sha256 && "$f" != *.sig && "$f" != *.pem ]]; then
              echo "Signing $f..."
              cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
            fi
          done
          ls -la

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  # Every CI recipe in the docs boils down to `curl install.sh | sh` resolving
  # the newest release. This job runs that EXACT public path right after the
  # assets land, and fails the release if the chain is broken — so "a new
  # release auto-updates every pipeline" is a property each release proves
  # about itself, not a hope. It would have caught both past breakages: the
  # wrong asset names (404) and `latest` resolving to the VS Code extension.
  verify-install:
    name: Verify the public install path
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Install via the documented one-liner and check the version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"

          # Same resolution as install.sh: this release is only expected to
          # BE "latest" when it is the newest crate tag — re-releasing an old
          # series must not fail here.
          newest="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | tr ',' '\n' \
            | sed -n 's/.*"tag_name" *: *"v\([0-9][0-9.]*\)".*/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"

          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh" \
            | SDC_INSTALL_DIR="$PWD/bin" sh
          got="$("$PWD/bin/searchdeadcode" --version | awk '{print $2}')"

          echo "released v$version, newest crate tag v$newest, installer delivered $got"
          if [ "$got" != "$newest" ]; then
            echo "::error::install.sh delivered $got but the newest release is $newest — the auto-update chain is broken"
            exit 1
          fi
          if [ "$version" = "$newest" ] && [ "$got" != "$version" ]; then
            echo "::error::this release is the newest yet install.sh delivered $got"
            exit 1
          fi

  # `uses: KevinDoremy/SearchDeadCode@v0` is what the docs tell people to write,
  # and it resolved to nothing: only exact tags existed. Same failure shape as
  # the tap and crates.io above — the thing users are told to use drifts away
  # from the thing that is published, and nothing goes red. The major tag moves
  # to each release so a workflow pinned to it keeps working without edits.
  major-tag:
    name: Move the floating major tag
    # After `release`, never before: the tag must not point at a release whose
    # binaries are not uploaded yet, or `@v0` briefly resolves to nothing to
    # download — the exact failure this job exists to end.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queued, never cancelled: two releases racing must both run, in order,
    # or a repoint gets skipped.
    concurrency:
      group: major-tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repoint vMAJOR at this release
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          major="v${version%%.*}"

          # Only move forward. Re-running an old release's workflow (which
          # this file explicitly supports for crates.io) or shipping a 0.16.2
          # hotfix after 0.17.0 must not drag the floating tag backwards onto
          # an older action. Same POSIX sort as install.sh — the vMAJOR.* glob
          # also keeps vscode-v* tags and the floating tag itself out.
          newest="$(git tag -l "${major}.*" | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$version" != "$newest" ]; then
            echo "v$version is not the newest ${major}.x (that is v$newest) — leaving $major alone"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ^{commit} peels an annotated tag to the release commit; GITHUB_SHA
          # on an annotated-tag push is the TAG OBJECT's sha, and a floating
          # tag pointing at a tag object breaks `uses:` resolution. No-op for
          # lightweight tags — and this repo's release tags ARE annotated.
          git tag -f "$major" "${GITHUB_REF#refs/tags/}^{commit}"
          git push -f origin "$major"
          echo "$major now points at the commit behind v$version"

  # The formula pins four binaries by URL and checksum, and updating it by hand
  # meant it silently drifted: the tap served 0.10.2 while the crate shipped
  # 0.13.0, so `brew install` handed out a tool three releases behind, carrying
  # false positives that had already been fixed. Nobody noticed, because a stale
  # formula installs perfectly well.
  #
  # crates.io was three releases behind GitHub for the same reason the tap was:
  # publishing it meant remembering to. `cargo install searchdeadcode` served
  # 0.10.2 while the repo shipped 0.13.0, and the README recommends that command
  # in two places.
  #
  # --locked so the published build resolves the dependency versions that were
  # actually tested, not whatever is newest at publish time.
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, cargo install would keep serving the previous version"
            exit 1
          fi
          # Re-running a release must not fail on a version already up.
          published="$(curl -s "https://crates.io/api/v1/crates/searchdeadcode" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["crate"]["max_version"])' || echo "")"
          want="${GITHUB_REF#refs/tags/v}"
          if [ "$published" = "$want" ]; then
            echo "crates.io already has $want, nothing to publish."
            exit 0
          fi
          cargo publish --locked

  # Separate job so a tap failure cannot roll back a published release: by this
  # point the binaries are out and crates.io has its own job.
  # The CircleCI orb tracks the crate version, one number everywhere: a team
  # pinning kevindoremy/searchdeadcode@0.19.0 installs analyzer 0.19.0,
  # forever — orb versions are immutable. Automated for the same reason the
  # tap and crates.io were: publishing by hand means forgetting, and the orb
  # would silently drift behind the crate.
  orb:
    name: Publish the CircleCI orb
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish kevindoremy/searchdeadcode at the crate version
        env:
          # Both spellings on purpose: the install script pulls the CURRENT
          # CLI, and v1.0 reads CIRCLE_TOKEN where the 0.1.x line read
          # CIRCLECI_CLI_TOKEN. Caught by the 0.19.0 release run — the local
          # rehearsal used the older Homebrew CLI and could not see it.
          CIRCLECI_CLI_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
          CIRCLE_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CIRCLECI_CLI_TOKEN:-}" ]; then
            echo "::error::CIRCLECI_CLI_TOKEN is not set — the orb would silently drift behind the crate"
            exit 1
          fi
          version="${GITHUB_REF#refs/tags/v}"

          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
          export CIRCLECI_CLI_TELEMETRY_OPTOUT=1

          # Re-running a release must not fail on an orb version already up
          # (orb versions are immutable, a second publish would error).
          if circleci orb source "kevindoremy/searchdeadcode@${version}" > /dev/null 2>&1; then
            echo "orb ${version} already published, nothing to do"
            exit 0
          fi

          # Pin the orb's default analyzer version to its own version. The
          # repo copy keeps an empty default (= newest) for direct use; the
          # published, immutable artifact promises reproducibility instead.
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 - "$version" <<'PY'
          import sys, yaml
          version = sys.argv[1]
          with open("integrations/circleci/orb.yml") as f:
              orb = yaml.safe_load(f)
          orb["commands"]["install"]["parameters"]["version"]["default"] = version
          orb["jobs"]["scan"]["parameters"]["version"]["default"] = version
          with open("/tmp/orb-pinned.yml", "w") as f:
              yaml.safe_dump(orb, f, sort_keys=False)
          PY

          circleci orb validate /tmp/orb-pinned.yml
          if ! out="$(circleci orb publish /tmp/orb-pinned.yml "kevindoremy/searchdeadcode@${version}" 2>&1)"; then
            # The v1 CLI can double-send: the first POST lands, its internal
            # retry gets "already exists", and the CLI exits 4 on work it
            # just did. Measured on 0.19.1 — the orb's createdAt sits in the
            # same second as the 400. A duplicate IS the desired end state.
            if printf '%s' "$out" | grep -qi "already exists"; then
              echo "orb ${version} is published (the publish reported a duplicate) — success"
            else
              printf '%s\n' "$out"
              exit 1
            fi
          else
            printf '%s\n' "$out"
          fi

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7

      # A token that merely exists is not enough: the failure that leaves the
      # tap stale is one that is present but scoped to the wrong repository,
      # and that only surfaces at the push. Prove the access first.
      - name: Verify the tap token
        env:
          # PAT with contents:write on the tap repo. github.token only reaches
          # this repository.
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TAP_TOKEN is not set, the tap would keep serving the previous version"
            exit 1
          fi
          if ! gh api repos/KevinDoremy/homebrew-tap --silent 2>/dev/null; then
            echo "::error::TAP_TOKEN cannot read KevinDoremy/homebrew-tap. Check it grants Contents on that repository."
            exit 1
          fi
          echo "Tap token accepted."

      - name: Point the tap at this release
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: ./scripts/update-homebrew-tap.sh "${GITHUB_REF#refs/tags/v}"

  # The extension bundles the analyzer, so a crate release that fixes a false
  # positive does not reach extension users until the extension is republished.
  # Left manual, that is the step everyone forgets: the tap and crates.io both
  # drifted three versions behind for exactly that reason.
  #
  # Only the bundled binary changes here, so the extension takes a patch bump.
  # Its own release workflow resolves the newest v[0-9]* release, which is the
  # one this run just published.
  vscode:
    name: Republish the VS Code extension
    runs-on: ubuntu-latest
    needs: [crates, homebrew]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A tag pushed with github.token starts no workflow: GitHub blocks
          # that to stop runs from triggering runs. The extension's release
          # would never fire. A PAT does not carry that restriction.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check the token
        run: |
          if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
            echo "::error::RELEASE_PAT is not set. The extension keeps bundling the previous analyzer."
            exit 1
          fi

      - name: Align the extension on the crate version and tag it
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          # One number everywhere: the extension takes the CRATE's version,
          # it no longer has its own line. The accepted consequence is that
          # an extension-only fix ships with the next crate release (or
          # triggers a crate patch) — the price of a single version across
          # every platform, chosen deliberately.
          current="$(node -p "require('./package.json').version")"
          next="${GITHUB_REF#refs/tags/v}"
          tag="vscode-v$next"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists, nothing to do."
            exit 0
          fi

          # Never backwards: re-releasing an old crate series (0.16.2 after
          # 0.19.0) must not drag the extension down — both registries would
          # refuse the version anyway, after the damage to the changelog.
          newest="$(printf '%s\n%s\n' "$current" "$next" \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$newest" != "$next" ] || [ "$current" = "$next" ]; then
            echo "extension is at $current, crate is $next — not moving backwards, nothing to do."
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$next';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          # Bumping only the version would leave the panel announcing the
          # previous release's news under a new number. This release carries
          # one change, a newer analyzer, so the copy says exactly that.
          crate_version="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const wn = JSON.parse(fs.readFileSync('media/whats-new.json', 'utf8'));
            wn.version = '$next';
            wn.tagline = 'A newer analyzer, bundled';
            wn.summary =
              'This release bundles searchdeadcode $crate_version. The extension itself is ' +
              'unchanged; what changed is the analysis behind it.';
            wn.highlights = [{
              title: 'Analyzer $crate_version',
              kind: 'improvement',
              description:
                'The bundled analyzer moves to $crate_version. Scans pick up its ' +
                'fixes with nothing to install: see the crate changelog for what ' +
                'changed in the analysis.',
            }];
            wn.sections = (wn.sections || []).filter(s => s.title === 'Requirements');
            fs.writeFileSync('media/whats-new.json', JSON.stringify(wn, null, 2) + '\n');
          "

          crate="${GITHUB_REF#refs/tags/v}"
          {
            echo "## $next"
            echo
            echo "Bundles the searchdeadcode $crate analyzer. See the crate"
            echo "[CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
            echo "for what changed in the analysis."
            echo
          } > /tmp/entry.md
          # Insert under the title, above the previous release.
          head -6 CHANGELOG.md > /tmp/new-changelog.md
          cat /tmp/entry.md >> /tmp/new-changelog.md
          tail -n +7 CHANGELOG.md >> /tmp/new-changelog.md
          mv /tmp/new-changelog.md CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json media/whats-new.json CHANGELOG.md
          git commit -m "chore: extension $next, bundling analyzer $crate"
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"
          echo "Tagged $tag; its own workflow publishes to both registries."

  # The release is only done when every shelf actually carries it. Each
  # channel below broke silently at least once (the tap served 0.10.2, the
  # action fell back to 0.4.0, latest resolved to the extension): this job
  # makes a lying channel turn the release red instead of drifting for
  # months. Hard failures are channels this pipeline publishes itself;
  # slow marketplaces (store-side validation) only warn.
  verify-channels:
    name: Verify every channel carries this release
    needs: [verify-install, major-tag, crates, orb, vscode]
    runs-on: ubuntu-latest
    steps:
      - name: Ask each shelf what version it serves
        env:
          CIRCLECI_CLI_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
        run: |
          set -uo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          failures=0

          # Skip everything when this run re-releases an old series: the
          # shelves rightly serve a newer version than this tag.
          newest="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | tr ',' '\n' | sed -n 's/.*"tag_name" *: *"v\([0-9][0-9.]*\)".*/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$version" != "$newest" ]; then
            echo "v$version is not the newest release (v$newest) — channels are expected to serve newer, skipping"
            exit 0
          fi

          check() { # check <name> <hard|soft> <tries> <sleep_s> <cmd...>
            local name="$1" mode="$2" tries="$3" pause="$4"; shift 4
            local i=1
            while [ "$i" -le "$tries" ]; do
              if "$@" > /tmp/check.out 2>&1; then
                echo "✓ $name"
                return 0
              fi
              [ "$i" -lt "$tries" ] && sleep "$pause"
              i=$((i + 1))
            done
            if [ "$mode" = "hard" ]; then
              echo "::error::$name does not carry $version: $(cat /tmp/check.out | head -2)"
              failures=$((failures + 1))
            else
              echo "::warning::$name not yet at $version (store-side validation can lag): $(cat /tmp/check.out | head -2)"
            fi
            return 0
          }

          crates_ok() {
            got="$(curl -s -A sdc-verify https://crates.io/api/v1/crates/searchdeadcode \
              | jq -r '.crate.max_version')"
            [ "$got" = "$version" ] || { echo "crates.io serves $got"; return 1; }
          }

          tap_ok() {
            curl -fsSL "https://raw.githubusercontent.com/KevinDoremy/homebrew-tap/main/Formula/searchdeadcode.rb" \
              | grep -q "$version" || { echo "formula does not mention $version"; return 1; }
          }

          orb_ok() {
            got="$(curl -s -X POST https://circleci.com/graphql-unstable \
              -H "Content-Type: application/json" \
              -d '{"query":"{ orb(name: \"kevindoremy/searchdeadcode\") { versions(count: 1) { version } } }"}' \
              | jq -r '.data.orb.versions[0].version')"
            [ "$got" = "$version" ] || { echo "orb registry serves $got"; return 1; }
          }

          v0_ok() {
            want="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/v${version}^{}" | cut -f1)"
            [ -n "$want" ] || want="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/v${version}" | cut -f1)"
            major="v${version%%.*}"
            got="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${major}" | cut -f1)"
            [ "$got" = "$want" ] || { echo "$major points at ${got:0:7}, release commit is ${want:0:7}"; return 1; }
          }

          openvsx_ok() {
            got="$(curl -s -m 20 https://open-vsx.org/api/elumine/searchdeadcode | jq -r '.version')"
            [ "$got" = "$version" ] || { echo "Open VSX serves $got"; return 1; }
          }

          msmarket_ok() {
            got="$(curl -s -m 20 -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
              -H "Content-Type: application/json" -H "Accept: application/json;api-version=3.0-preview.1" \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"elumine.searchdeadcode"}]}],"flags":103}' \
              | jq -r '.results[0].extensions[0].versions[0].version')"
            [ "$got" = "$version" ] || { echo "VS Marketplace serves $got"; return 1; }
          }

          ghmarket_ok() {
            curl -fsSL "https://github.com/marketplace/actions/searchdeadcode" \
              | grep -q "v$version" || { echo "the action listing does not mention v$version"; return 1; }
          }

          # Hard: shelves this pipeline stocks itself.
          check "crates.io"          hard 10 30 crates_ok
          check "homebrew tap"       hard 10 30 tap_ok
          check "circleci orb"       hard  5 30 orb_ok
          check "floating v0 tag"    hard  3 20 v0_ok

          # Soft: the extension publishes from a separate tag-triggered
          # workflow and both stores validate on their own clock.
          check "open vsx"           soft 15 60 openvsx_ok
          check "vs marketplace"     soft  3 60 msmarket_ok
          check "github marketplace" soft  3 60 ghmarket_ok

          [ "$failures" -eq 0 ] || exit 1
          echo "every hard channel carries $version"
